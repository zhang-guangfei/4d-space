<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c171d">
  <meta name="description" content="《维度之外》Codex 版第二章。你与岑遥迷失在陌生文明留下的回声场。沿第四个空间方向寻找彼此。">
  <title>折页之间 · 维度之外 Codex 版</title>
  <link rel="icon" type="image/png" href="../assets/codex-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-mode="loading">
  <header class="bridge-head">
    <div class="brand"><i class="fold-mark" aria-hidden="true"></i><b>维度之外</b><span>Codex 版</span></div>
    <nav aria-label="章节"><a href="../index.html">第一章 <b>外壳上的迷宫</b></a><a class="current" href="./" aria-current="page">第二章 <b>折页之间</b></a></nav>
    <div class="head-controls">
      <label class="section-chooser"><span class="sr">选择小节</span><select id="chapter-select" aria-label="选择小节" disabled><option>读取小节…</option></select></label>
      <button type="button" id="sound" aria-pressed="true" aria-label="切换通讯音效" title="切换通讯音效">音效开</button>
      <button type="button" id="pause" hidden>暂停 <kbd>Esc</kbd></button>
    </div>
  </header>
  <main id="bridge">
    <section class="world-column" aria-label="第一人称行动区">
      <div class="viewport">
        <canvas id="world" tabindex="0" aria-label="折页之间第一人称三维场景"></canvas>
        <div class="world-hud" id="world-hud">
          <div class="mission"><div class="section-id" id="section-id"></div><h1 id="mission-title">折页之间</h1><div class="objective-line"><span aria-hidden="true">目标</span><p id="objective" aria-label="当前目标" aria-live="polite"></p></div></div>
          <div class="reticle" aria-hidden="true"></div>
          <div class="field-action"><button hidden id="interact" type="button" aria-keyshortcuts="F"><kbd>F</kbd><span id="interact-text">交互</span></button></div>
        </div>
        <p class="signal-status" id="status" role="status">正在显影…</p>
        <section id="gate" aria-labelledby="gate-title" hidden>
          <div class="gate-content">
            <p class="chapter-kicker" id="gate-kicker"></p>
            <h1 id="gate-title"></h1>
            <p class="subtitle" id="gate-subtitle"></p>
            <p class="incoming" id="gate-story"></p>
            <button type="button" id="start" disabled>继续行动</button>
            <div class="quality-controls">
              <label for="resolution">画质</label>
              <select id="resolution"><option value="auto">自动 · 目标 60 FPS</option><option value="native">原生像素</option><option value="high">高清采样</option></select>
              <output id="resolution-readout" aria-label="三维渲染尺寸和游玩帧率"></output>
            </div>
          </div>
        </section>
      </div>
      <div class="radio" aria-live="polite">
        <div class="transmission">
          <div class="field-note"><span class="context-label">现场</span><p id="section-context"></p></div>
          <div class="voice-line" id="voice-line" hidden><span class="call-sign"><i aria-hidden="true"></i><span id="speaker"></span></span><p id="dialogue"></p></div>
        </div>
        <button type="button" id="next" aria-keyshortcuts="N" hidden><kbd>N</kbd> <span id="next-name">下一小节</span>　→</button>
      </div>
      <div class="world-keys" aria-label="第一人称操作说明">
        <span><kbd>WASD</kbd> 行走</span>
        <span id="shift-hint"><kbd>滚轮</kbd> <span id="shift-tug" hidden>控车 · </span>上滚 W+ · 下滚 W−</span>
        <span><kbd id="interact-key">F</kbd> 交互</span>
        <button type="button" id="pointer-toggle" class="pointer-hint" aria-keyshortcuts="T" aria-pressed="false" title="可拖动画面或用方向键环视"><b id="pointer-state">拖动环视</b> <kbd id="switch-key">T</kbd> <span id="switch-action">捕获鼠标</span></button>
      </div>
    </section>
    <aside class="console" aria-label="高维操作台">
      <div class="console-head"><div class="rig-symbol" aria-hidden="true"><i></i></div><h2>高维操作台</h2><button id="expand" type="button" aria-expanded="true" aria-controls="instrument" title="收起操作台"><span class="sr">收起操作台</span><span class="chevron" aria-hidden="true">›</span></button></div>
      <div id="instrument">
        <div class="monitor">
          <div class="monitor-head"><b id="scope-title">W 取样窗</b><span id="basis-readout">XYZ</span></div>
          <canvas id="scope" role="img" aria-label="四个并列 W 切片的同一 XYZ 位置"></canvas>
          <div class="legend" id="scope-legend"></div>
          <p class="scope-note" id="scope-note" hidden></p>
        </div>
        <div class="console-controls">
          <div class="dial-head"><h3 id="dial-title">当前 W 切片</h3><output id="w-value">W 01</output></div>
          <div class="slice-keys" id="slice-keys" aria-label="沿 W 改变切片"></div>
          <div class="section-controls" id="section-controls"></div>
        </div>
        <div class="measurement" id="measurement" hidden>
          <div class="measurement-head"><b id="measurement-title"></b><output id="measurement-value"></output></div>
          <canvas id="measurement-view" role="img"></canvas>
        </div>
        <div class="range-instrument" id="range-instrument">
          <div><span>目标距离</span><b id="beacon-name"></b></div>
          <div class="range-reading"><output id="range"></output><span aria-hidden="true" class="range-track"><i id="range-bar"></i></span></div>
        </div>
        <div class="instrument-base"><i aria-hidden="true"></i><span id="instrument-status">接收器待命</span></div>
      </div>
    </aside>
  </main>
  <script src="../vendor/babylon.js"></script>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
